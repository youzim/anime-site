# MySQL 模式（本地开发用）：设置环境变量 SPRING_PROFILES_ACTIVE=mysql 时生效
# Railway 等平台的 MySQL 会提供 DATABASE_URL（完整 jdbc 连接串）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/exam_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      encoding: UTF-8
