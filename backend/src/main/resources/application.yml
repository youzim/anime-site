server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Railway MySQL 插件会提供 DATABASE_URL（完整 jdbc 连接串，含账号密码），直接读取；
    # 本地开发不设置时回退到 localhost 默认值
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/exam_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  # 启动时自动建表 + 灌种子数据（幂等，部署零人工初始化）
  sql:
    init:
      mode: always
      encoding: UTF-8

# JWT 配置
jwt:
  # 签名密钥，至少 32 个字符（正式项目请改掉并放到环境变量）
  secret: ${JWT_SECRET:auth-backend-demo-secret-key-2026-change-me}
  expire-hours: 24
