server:
  port: 8080

spring:
  # 默认使用内置 H2 数据库（内存模式，启动自动建表灌数据，零外部依赖，适合免费部署）
  # 需要连接 MySQL 时，设置环境变量 SPRING_PROFILES_ACTIVE=mysql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:anime;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8

# JWT 配置
jwt:
  # 签名密钥，至少 32 个字符（部署时可用环境变量 JWT_SECRET 覆盖）
  secret: ${JWT_SECRET:auth-backend-demo-secret-key-2026-change-me}
  expire-hours: 24
