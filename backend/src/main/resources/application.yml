server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 部署时通过环境变量覆盖（Railway 等平台设置 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_auth}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

# JWT 配置
jwt:
  # 签名密钥，至少 32 个字符（正式项目请改掉并放到环境变量）
  secret: ${JWT_SECRET:auth-backend-demo-secret-key-2026-change-me}
  expire-hours: 24
